name: Build & Deploy (FTP)

# Builds the static Astro site in CI and uploads dist/ to KnownHost over FTP.
# Incremental: the action keeps .ftp-deploy-sync-state.json on the server and
# only transfers changed files. See DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to KnownHost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Upload the built site into the FTP account's document root.
          local-dir: ./dist/
          server-dir: ./
